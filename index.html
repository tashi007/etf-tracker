<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETF Portfolio Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .etf-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #1e293b;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .etf-splash-inner {
        text-align: center;
      }
      .etf-splash-spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border: 4px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 9999px;
        animation: etf-splash-spin 0.8s linear infinite;
      }
      @keyframes etf-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .etf-splash-brand {
        margin-top: 1rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .etf-splash {
          background: #020617;
          color: #f1f5f9;
        }
        .etf-splash-spinner {
          border-color: #334155;
          border-top-color: #818cf8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .etf-splash-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="etf-splash">
        <div class="etf-splash-inner">
          <div class="etf-splash-spinner" aria-hidden="true"></div>
          <div class="etf-splash-brand">ETF Portfolio Tracker</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
