<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETF Portfolio Tracker</title>
    <style>
      .etf-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        color: #374151;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .etf-splash-inner {
        text-align: center;
      }
      .etf-splash-spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto;
        border: 4px solid #d1d5db;
        border-top-color: #3b82f6;
        border-radius: 9999px;
        animation: etf-splash-spin 0.8s linear infinite;
      }
      @keyframes etf-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .etf-splash-brand {
        margin-top: 1rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .etf-splash {
          background: #111827;
          color: #f3f4f6;
        }
        .etf-splash-spinner {
          border-color: #374151;
          border-top-color: #3b82f6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .etf-splash-spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="etf-splash">
        <div class="etf-splash-inner">
          <div class="etf-splash-spinner" aria-hidden="true"></div>
          <div class="etf-splash-brand">ETF Portfolio Tracker</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
